<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO CONECT FTTH - Utilizatori</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f4f7fb;
    color:#333;
}

.header{
    background:linear-gradient(
        135deg,
        #005baa,
        #0072ce
    );
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:12px;
    background:white;
    color:#005baa;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.app-title{
    font-size:24px;
    font-weight:700;
}

.app-subtitle{
    font-size:14px;
    opacity:.9;
}

.container{
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.back-btn{
    text-decoration:none;
    color:white;
    background:#005baa;
    padding:10px 15px;
    border-radius:8px;
    font-weight:600;
}

.back-btn:hover{
    background:#00468a;
}

.box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
    color:#005baa;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    background:#005baa;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#00468a;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    background:#005baa;
    color:white;
    text-align:left;
}

.table th,
.table td{
    padding:12px;
    border:1px solid #ddd;
}

.role-manager{
    color:#005baa;
    font-weight:700;
}

.role-tech{
    color:green;
    font-weight:700;
}

</style>

</head>

<body>

<div class="header">

    <div class="logo-area">

        <div class="logo-icon">
            PC
        </div>

        <div>

            <div class="app-title">
                PRO CONECT FTTH
            </div>

            <div class="app-subtitle">
                Platformă management ODB și măsurători optice
            </div>

        </div>

    </div>

</div>

<div class="container">

    <div class="topbar">

    <h2>👤 Administrare Utilizatori</h2>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</div>

    <div class="box">

        <h3>Utilizator Nou</h3>

        <label>Nume complet</label>

        <input
            type="text"
            id="fullName"
            placeholder="Ex: Ion Pop">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Ex: ion.pop">

        <label>Parolă</label>

        <input
            type="password"
            id="password"
            placeholder="Parolă">

        <label>Rol</label>

        <select id="role">

            <option value="Manager">
                Manager
            </option>

            <option value="Tehnician">
                Tehnician
            </option>

        </select>

        <button onclick="addUser()">
            Adaugă Utilizator
        </button>

    </div>

    <div class="box">

        <h3>Lista Utilizatori</h3>

        <table class="table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nume</th>
                    <th>Username</th>
                    <th>Rol</th>
                </tr>

            </thead>

            <tbody id="usersTable">

            </tbody>

        </table>

    </div>

</div>

<script>

let users = [

    {
        id:1,
        fullName:"Administrator",
        username:"admin",
        role:"Manager"
    },

    {
        id:2,
        fullName:"Ion Pop",
        username:"ion.pop",
        role:"Tehnician"
    }

];

function renderUsers(){

    const table =
        document.getElementById(
            "usersTable"
        );

    table.innerHTML = "";

    users.forEach(user => {

        let roleClass =
            user.role === "Manager"
            ? "role-manager"
            : "role-tech";

        table.innerHTML += `

        <tr>

            <td>${user.id}</td>

            <td>${user.fullName}</td>

            <td>${user.username}</td>

            <td class="${roleClass}">
                ${user.role}
            </td>

        </tr>

        `;

    });

}

function addUser(){

    const fullName =
        document.getElementById(
            "fullName"
        ).value.trim();

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value.trim();

    const role =
        document.getElementById(
            "role"
        ).value;

    if(
        fullName === "" ||
        username === "" ||
        password === ""
    ){
        alert(
            "Completați toate câmpurile."
        );
        return;
    }

    users.push({

        id:users.length + 1,
        fullName:fullName,
        username:username,
        role:role

    });

    document.getElementById(
        "fullName"
    ).value = "";

    document.getElementById(
        "username"
    ).value = "";

    document.getElementById(
        "password"
    ).value = "";

    renderUsers();

}

renderUsers();

</script>

</body>
</html>
