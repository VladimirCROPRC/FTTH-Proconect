<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO CONECT FTTH - Alocări</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f4f7fb;
    color:#333;
}

.header{
    background:linear-gradient(
        135deg,
        #005baa,
        #0072ce
    );
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:12px;
    background:white;
    color:#005baa;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.app-title{
    font-size:24px;
    font-weight:700;
}

.app-subtitle{
    font-size:14px;
    opacity:.9;
}

.container{
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.back-btn{
    text-decoration:none;
    color:white;
    background:#005baa;
    padding:10px 15px;
    border-radius:8px;
    font-weight:600;
}

.back-btn:hover{
    background:#00468a;
}

.box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
    color:#005baa;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    background:#005baa;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#00468a;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    background:#005baa;
    color:white;
    text-align:left;
}

.table th,
.table td{
    padding:12px;
    border:1px solid #ddd;
}

.badge{
    background:#e8f2ff;
    color:#005baa;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.delete-btn{
    background:#d9534f;
    padding:8px 12px;
    border-radius:8px;
    color:white;
    border:none;
    cursor:pointer;
}

.delete-btn:hover{
    background:#c9302c;
}

</style>

</head>

<body>

<div class="header">

    <div class="logo-area">

        <div class="logo-icon">
            PC
        </div>

        <div>

            <div class="app-title">
                PRO CONECT FTTH
            </div>

            <div class="app-subtitle">
                Platformă management ODB și măsurători optice
            </div>

        </div>

    </div>

</div>

<div class="container">

    <div class="topbar">

        <h2>🔗 Alocare Tehnicieni</h2>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </div>

    <div class="box">

        <h3>Alocare Nouă</h3>

        <label>Proiect</label>

        <select id="projectSelect"></select>

        <label>Tehnician</label>

        <select id="userSelect"></select>

        <button onclick="addAssignment()">
            Alocă Tehnician
        </button>

    </div>

    <div class="box">

        <h3>Alocări Existente</h3>

        <table class="table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Proiect</th>
                    <th>Tehnician</th>
                    <th>Acțiune</th>
                </tr>

            </thead>

            <tbody id="assignmentsTable">

            </tbody>

        </table>

    </div>

</div>

<script>

const projects = [
    "FTTH Floresti Sud",
    "FTTH Apahida Nord",
    "FTTH Baciu"
];

const technicians = [
    "Ion Pop",
    "Vasile Muresan",
    "Andrei Moldovan"
];

let assignments = [];

function loadCombos(){

    const projectSelect =
        document.getElementById(
            "projectSelect"
        );

    const userSelect =
        document.getElementById(
            "userSelect"
        );

    projects.forEach(project => {

        projectSelect.innerHTML +=
        `<option>${project}</option>`;

    });

    technicians.forEach(user => {

        userSelect.innerHTML +=
        `<option>${user}</option>`;

    });

}

function addAssignment(){

    const project =
        document.getElementById(
            "projectSelect"
        ).value;

    const technician =
        document.getElementById(
            "userSelect"
        ).value;

    const exists =
        assignments.some(a =>
            a.project === project &&
            a.technician === technician
        );

    if(exists){

        alert(
            "Această alocare există deja."
        );

        return;
    }

    assignments.push({

        id:
            assignments.length + 1,

        project:
            project,

        technician:
            technician

    });

    renderAssignments();

}

function deleteAssignment(id){

    assignments =
        assignments.filter(
            a => a.id !== id
        );

    renderAssignments();

}

function renderAssignments(){

    const table =
        document.getElementById(
            "assignmentsTable"
        );

    table.innerHTML = "";

    assignments.forEach(item => {

        table.innerHTML += `

        <tr>

            <td>${item.id}</td>

            <td>
                <span class="badge">
                    ${item.project}
                </span>
            </td>

            <td>
                ${item.technician}
            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteAssignment(${item.id})">

                    Șterge

                </button>

            </td>

        </tr>

        `;

    });

}

loadCombos();

</script>

</body>

</html>
