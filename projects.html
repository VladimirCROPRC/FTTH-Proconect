<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO CONECT FTTH - Proiecte</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f4f7fb;
    color:#333;
}

.header{
    background:linear-gradient(
        135deg,
        #005baa,
        #0072ce
    );
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:12px;
    background:white;
    color:#005baa;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.app-title{
    font-size:24px;
    font-weight:700;
}

.app-subtitle{
    font-size:14px;
    opacity:.9;
}

.container{
    padding:25px;
}

.box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
    color:#005baa;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    background:#005baa;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#00468a;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    background:#005baa;
    color:white;
    text-align:left;
}

.table th,
.table td{
    padding:12px;
    border:1px solid #ddd;
}

.status-active{
    color:green;
    font-weight:600;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.back-btn{
    text-decoration:none;
    color:white;
    background:#005baa;
    padding:10px 15px;
    border-radius:8px;
    font-weight:600;
}

.back-btn:hover{
    background:#00468a;
}

</style>

</head>

<body>

<div class="header">

    <div class="logo-area">

        <div class="logo-icon">
            PC
        </div>

        <div>

            <div class="app-title">
                PRO CONECT FTTH
            </div>

            <div class="app-subtitle">
                Platformă management ODB și măsurători optice
            </div>

        </div>

    </div>

</div>

<div class="container">

    <div class="topbar">

        <h2>📁 Administrare Proiecte</h2>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </div>

    <div class="box">

        <h3>Proiect Nou</h3>

        <label>Nume Proiect</label>

        <input
            type="text"
            id="projectName"
            placeholder="Ex: FTTH Floresti Sud">

        <button onclick="addProject()">
            Adaugă Proiect
        </button>

    </div>

    <div class="box">

        <h3>Lista Proiecte</h3>

        <table class="table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nume Proiect</th>
                    <th>Status</th>
                    <th>Data Creare</th>
                </tr>

            </thead>

            <tbody id="projectsTable">

            </tbody>

        </table>

    </div>

</div>

<script>

let projects = [

    {
        id:1,
        name:"FTTH Floresti Sud",
        status:"Activ",
        created:"17.08.2026"
    },

    {
        id:2,
        name:"FTTH Apahida Nord",
        status:"Activ",
        created:"17.08.2026"
    }

];

function renderProjects(){

    const table =
        document.getElementById(
            "projectsTable"
        );

    table.innerHTML = "";

    projects.forEach(project => {

        table.innerHTML += `

        <tr>

            <td>${project.id}</td>

            <td>${project.name}</td>

            <td class="status-active">
                ${project.status}
            </td>

            <td>${project.created}</td>

        </tr>

        `;

    });

}

function addProject(){

    const name =
        document.getElementById(
            "projectName"
        ).value.trim();

    if(name === ""){

        alert(
            "Introduceți numele proiectului."
        );

        return;
    }

    projects.push({

        id: projects.length + 1,
        name: name,
        status: "Activ",
        created: new Date().toLocaleDateString()

    });

    document.getElementById(
        "projectName"
    ).value = "";

    renderProjects();

}

renderProjects();

</script>

</body>
</html>
