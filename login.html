<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO CONECT FTTH - Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    margin:0;
    min-height:100vh;
    background:#f4f7fb;
    color:#333;
}

.header{
    background:linear-gradient(
        135deg,
        #005baa,
        #0072ce
    );
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:12px;
    background:white;
    color:#005baa;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.app-title{
    font-size:24px;
    font-weight:700;
}

.app-subtitle{
    font-size:14px;
    opacity:.9;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 100px);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:14px;
    padding:30px;
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.08);
}

.login-title{
    text-align:center;
    margin-bottom:25px;
}

.login-title h2{
    margin:0 0 5px 0;
    color:#005baa;
}

.login-title p{
    margin:0;
    color:#666;
    font-size:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d8dce3;
    border-radius:10px;
    margin-bottom:18px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#0072ce;
    box-shadow:0 0 0 3px rgba(0,114,206,.15);
}

button{
    width:100%;
    background:#005baa;
    color:white;
    border:none;
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    background:#00468a;
}

.footer-text{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#777;
}

.version{
    text-align:center;
    margin-top:8px;
    color:#999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="header">

    <div class="logo-area">

        <div class="logo-icon">
            PC
        </div>

        <div>

            <div class="app-title">
                PRO CONECT FTTH
            </div>

            <div class="app-subtitle">
                Platformă management ODB și măsurători optice
            </div>

        </div>

    </div>

</div>

<div class="main">

    <div class="login-box">

        <div class="login-title">

            <h2>Autentificare</h2>

            <p>
                Introdu username-ul și parola pentru acces
            </p>

        </div>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required>

            <label for="password">
                Parolă
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

            <button type="submit">
                Conectare
            </button>

        </form>

        <div class="footer-text">
            PRO CONECT FTTH
        </div>

        <div class="version">
            Versiunea 0.1
        </div>

    </div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    console.log(
        "Login:",
        username,
        password
    );

    // TODO:
    // apel API:
    // POST /api/auth/login

});

</script>

</body>
</html>
